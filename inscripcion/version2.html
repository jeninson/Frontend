<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root{
            --color-fondo: #000000;
            --color-letra: #ececec;
            --color-main: #ff9900;
            --color1: #002055;
            --color2: #04603B;
            --color3: #0D6B6A;
        }
        .container{
            width: 100%;
            min-width: 600px;
            background: linear-gradient(to top, var(--color2), var(--color1));
            padding: 4rem 4rem;
        }
        .logo{
            width: 100px;
            height: 100px;
            padding: 5px;
            border: 3px solid var(--color-letra);
            border-radius: 50%;
        }
        .caja {
            color: var(--color-letra);
            background-color: var(--color3);
            border: 1px solid var(--color3);
        }
        .caja:focus {
            color: var(--color-letra);
            background-color: var(--color3);
            border: 1px solid var(--color3);
        }
    </style>
</head>
  <body class="text-bg-dark">
    <div class="container text-center mt-5">
        <div class="row align-items-center">
            <div class="col text-center">
                <div class="col-10 offset-1">
                    <header>
                        <img src="img/logo3.png" alt="Logo" class="img-fluid logo">
                        <h1>Formulario de Inscripción</h1>
                    </header>
                    <div class="form-container text-start mt-5">
                        <form action="#" method="get" class="">
                            <div class="form-floating mb-3">
                                <input type="number" id="ident" name="ident" class="form-control caja"  placeholder="Numero de Identificación" required>
                                <label for="ident" class="text-light">Numero de Identificación</label>
                            </div>
                            <div class="form-floating mb-3">        
                                <input type="text" id="nombre" name="nombre" required class="form-control caja" placeholder="Nombres">
                                <label for="nombre" class="text-light">Nombres</label>
                            </div>                      
                            <div class="form-floating mb-3">
                                <input type="text" id="apellido" name="apellido" required class="form-control caja" placeholder="Apellidos">
                                <label for="apellido" class="text-light">Apellidos</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" id="email" name="email" required class="form-control caja" placeholder="Correo Electrónico">
                                <label for="email" class="text-light">Correo Electrónico</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="tel" id="celular" name="celular" required class="form-control caja" placeholder="Celular">
                                <label for="celular" class="text-light">Celular</label>
                            </div>
                            <div class="mt-3 text-center d-grid">
                                <button type="submit" class="btn btn-warning btn-lg">Enviar</button>
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
