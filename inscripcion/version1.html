<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción V1</title>
    <link rel="stylesheet" href="version1.css">
</head>
<body>
    <main>
        <section>
            <header>
                <img src="img/logo3.png" alt="Logo">
                <h1>Formulario de Inscripción</h1>
            </header>
            <form action="#" method="get">
                <label for="ident">Numero de Identificación</label>
                <input type="number" id="ident" name="ident" required>
                <label for="nombre">Nombres</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="apellido">Apellidos</label>
                <input type="text" id="apellido" name="apellido" required>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" required>
                <button type="submit">Enviar</button>
                <button type="button" onclick="window.location.href='index.html'">Regresar</button>
            </form>
        </section>
    </main>
</body>
</html>
