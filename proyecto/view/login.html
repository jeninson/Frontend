<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../css/estilo_login.css">
</head>
<body>
    <main class="login">
        <h1>Iniciar sesión</h1>
        <p class="intro">Ingresa tus credenciales del sistema.</p>

        <form action="../backend/config.php" method="post" autocomplete="off" id="form-login" name="form-login">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" value="" placeholder="tu@correo.com" required>
            </div>

            <div class="field">
                <label for="clave">Contraseña</label>
                <input type="text" id="clave" name="clave" value="" autocomplete="" placeholder="Ingresa tu contraseña" maxlength="10" required>
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <p class="help"><a href="#">¿Olvidaste tu contraseña?</a></p>
    </main>
    <script src="../js/main.js" type="module"></script>
</body>
</html>
